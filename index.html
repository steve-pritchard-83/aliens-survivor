<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050709" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Quest: ask for VR the moment the page starts, before any bundle has loaded. Launching the installed app counts
      // as the click WebXR requires, but that allowance is short, so waiting for the app to mount (or for a slow first
      // load after an update) can lose it and leave you on the 2D page. The game's own request (src/core/XRStore.ts)
      // is handed this session. If the browser refuses (no click yet), it falls back to the normal request.
      (function () {
        try {
          var quest = /OculusBrowser|Quest/i.test(navigator.userAgent) || new URLSearchParams(location.search).get('vr') === '1';
          var xr = navigator.xr;
          if (!quest || !xr || !xr.requestSession) return;
          var original = xr.requestSession.bind(xr);
          var early = original('immersive-vr', { requiredFeatures: ['local-floor'], optionalFeatures: ['hand-tracking'] });
          early.catch(function () {});
          var handedOver = false;
          var ended = false;
          early.then(function (session) {
            session.addEventListener('end', function () {
              ended = true;
            });
            // If the app never claims the session (the bundle failed to load), do not strand the player in a black
            // headset. Generous, so a slow first load after an update still gets its session
            setTimeout(function () {
              if (!handedOver) session.end().catch(function () {});
            }, 90000);
          }, function () {});
          xr.requestSession = function (mode, init) {
            if (mode === 'immersive-vr' && !handedOver && !ended) {
              handedOver = true;
              return early.catch(function () {
                return original(mode, init);
              });
            }
            return original(mode, init);
          };
        } catch (e) {
          /* WebXR unavailable: nothing to do */
        }
      })();
    </script>
    <title>ALIENS SURVIVOR — USS SULACO</title>
    <style>
      @font-face {
        font-family: 'AlienLeague';
        src: url('/fonts/AlienLeague.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030507;
        color: #00ff88;
        font-family: 'AlienLeague', 'Courier New', monospace;
        touch-action: manipulation;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #ffcc66;
        outline-offset: 2px;
      }
      input[type='range'] {
        accent-color: #00ff88;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
