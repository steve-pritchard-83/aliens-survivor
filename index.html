<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050709" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>ALIENS SURVIVOR — USS SULACO</title>
    <style>
      @font-face {
        font-family: 'AlienLeague';
        src: url('/fonts/AlienLeague.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030507;
        color: #00ff88;
        font-family: 'AlienLeague', 'Courier New', monospace;
        touch-action: manipulation;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #ffcc66;
        outline-offset: 2px;
      }
      input[type='range'] {
        accent-color: #00ff88;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
